name: Feature proposal
description: Propose a production-capability or governance improvement.
title: "[Feature]: "
labels: ["enhancement"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Describe the need and production outcome before prescribing an implementation. Security
        vulnerabilities belong in
        [SECURITY.md](https://github.com/Sawmonabo/market-squawk/blob/main/SECURITY.md). Do not
        include credentials, private portfolio data, exchange secrets, proprietary datasets, or
        unredacted logs.
  - type: textarea
    id: problem
    attributes:
      label: Problem and users
      description: What concrete problem exists, and who encounters it?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Required production outcome
      description: Define observable success without assuming a particular implementation.
    validations:
      required: true
  - type: dropdown
    id: domain
    attributes:
      label: Primary domain
      options:
        - Shared domain contracts
        - Live data, validation, or order books
        - Research ingestion, storage, or point-in-time data
        - Analytics, modeling, or backtesting
        - Portfolio, risk, or execution
        - Fair value, CLI, or MCP
        - Security, release, or repository governance
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed capability and boundaries
      description: Describe data flow, authority boundaries, failure behavior, and explicit non-goals.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Compare viable approaches and why the proposal is preferable.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance and verification
      description: List deterministic tests, measurements, compatibility needs, and documentation.
    validations:
      required: true
  - type: checkboxes
    id: invariants
    attributes:
      label: Product constraints
      options:
        - label: The proposal preserves the zero-mandatory-cost and local-first product boundary.
          required: true
        - label: Any new authority is explicit, bounded, fail-closed, and cannot bypass risk.
          required: true
        - label: The proposal does not evade provider quotas, blocking, identity, or access controls.
          required: true
        - label: This proposal contains no confidential or security-sensitive material.
          required: true

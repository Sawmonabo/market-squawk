name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      # actions/checkout v6.0.2, verified release commit (2026-01-09).
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: false
      # dtolnay/rust-toolchain generic action, verified commit (2026-06-30).
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      # Swatinem/rust-cache v2.9.1, verified release commit (2026-03-12).
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
        with:
          workspaces: ". -> target"
          cache-targets: "true"
          cache-on-failure: "false"
          cache-all-crates: "false"
          cache-workspace-crates: "false"
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      # taiki-e/install-action v2.83.4, verified release commit (2026-07-17).
      - uses: taiki-e/install-action@07b4745e0c39a41822af610387492e3e53aa222b
        with:
          tool: cargo-audit@0.22.2,cargo-deny@0.20.2
      - name: Install pinned Gitleaks CLI
        shell: bash
        run: |
          archive="$RUNNER_TEMP/gitleaks_8.30.1_linux_x64.tar.gz"
          binary_dir="$RUNNER_TEMP/gitleaks-bin"
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output "$archive" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" \
            | sha256sum --check --strict
          mkdir -p "$binary_dir"
          tar -xzf "$archive" -C "$binary_dir" gitleaks
          echo "$binary_dir" >> "$GITHUB_PATH"
      - run: rustc --version
      - run: cargo --version
      - run: ./scripts/verify.sh

  macos:
    runs-on: macos-15-intel
    timeout-minutes: 60
    steps:
      # actions/checkout v6.0.2, verified release commit (2026-01-09).
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      # dtolnay/rust-toolchain generic action, verified commit (2026-06-30).
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: 1.97.1
      # Swatinem/rust-cache v2.9.1, verified release commit (2026-03-12).
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
        with:
          workspaces: ". -> target"
          cache-targets: "true"
          cache-on-failure: "false"
          cache-all-crates: "false"
          cache-workspace-crates: "false"
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - run: rustc --version
      - run: cargo --version
      - run: cargo test --workspace --all-features --locked

  windows:
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      # actions/checkout v6.0.2, verified release commit (2026-01-09).
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      # dtolnay/rust-toolchain generic action, verified commit (2026-06-30).
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: 1.97.1
      # Swatinem/rust-cache v2.9.1, verified release commit (2026-03-12).
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
        with:
          workspaces: ". -> target"
          cache-targets: "true"
          cache-on-failure: "false"
          cache-all-crates: "false"
          cache-workspace-crates: "false"
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - run: rustc --version
      - run: cargo --version
      - run: cargo test --workspace --all-features --locked

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      platform_verification:
        description: Run the complete locked matrix on an admitted frozen candidate
        required: true
        default: false
        type: boolean
      candidate_sha:
        description: Exact 40-character commit at the selected remote branch tip
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  CANDIDATE_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.candidate_sha || github.event.pull_request.head.sha || github.sha }}

jobs:
  classify:
    name: Classify changes
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.changes.outputs.code }}
      documentation: ${{ steps.changes.outputs.documentation }}
      rust: ${{ steps.changes.outputs.rust }}
      python: ${{ steps.changes.outputs.python }}
      desktop: ${{ steps.changes.outputs.desktop }}
      scripts: ${{ steps.changes.outputs.scripts }}
      package: ${{ steps.changes.outputs.package }}
      linux_matrix: ${{ steps.changes.outputs.linux_matrix }}
      platform: ${{ steps.release_scope.outputs.platform }}
      tree_sha: ${{ steps.freeze.outputs.tree_sha }}
    steps:
      - id: release_scope
        name: Admit explicit release platform verification
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PLATFORM_VERIFICATION: ${{ inputs.platform_verification || false }}
          WORKFLOW_REF: ${{ github.ref }}
          CANDIDATE_SHA: ${{ env.CANDIDATE_SHA }}
        run: |
          set -euo pipefail

          platform=false
          if [[ "$PLATFORM_VERIFICATION" == "true" ]]; then
            if [[ "$EVENT_NAME" != "workflow_dispatch" ]]; then
              echo "Complete platform verification requires an explicit dispatch." >&2
              exit 1
            fi
            if [[ ! "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
              echo "Complete platform verification requires an exact lowercase commit SHA." >&2
              exit 1
            fi
            case "$WORKFLOW_REF" in
              refs/heads/feature/v1-installed-product-experience|refs/heads/release/*) ;;
              *)
                echo "Complete platform verification requires an admitted frozen candidate branch." \
                  >&2
                exit 1
                ;;
            esac
            platform=true
          fi
          echo "platform=$platform" >> "$GITHUB_OUTPUT"
      # actions/checkout v7.0.1, verified release commit (2026-07-22).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - id: freeze
        name: Freeze the explicit candidate identity
        shell: bash
        env:
          PLATFORM_VERIFICATION: ${{ steps.release_scope.outputs.platform }}
          WORKFLOW_REF: ${{ github.ref }}
          CANDIDATE_SHA: ${{ env.CANDIDATE_SHA }}
        run: |
          set -euo pipefail

          observed_head="$(git rev-parse HEAD)"
          [[ "$observed_head" == "$CANDIDATE_SHA" ]]
          git diff --quiet
          git diff --cached --quiet
          if [[ "$PLATFORM_VERIFICATION" == "true" ]]; then
            remote_head="$(git ls-remote --exit-code origin "$WORKFLOW_REF" | awk 'NR == 1 {print $1}')"
            [[ "$remote_head" == "$CANDIDATE_SHA" ]]
          fi
          echo "tree_sha=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"
      - id: changes
        name: Classify the exact change set
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          EVENT_BEFORE: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ env.CANDIDATE_SHA }}
          FULL_CANDIDATE: ${{ steps.release_scope.outputs.platform }}
        run: |
          set -euo pipefail

          documentation=false
          rust=false
          python=false
          desktop=false
          scripts=false
          package=false
          resolved=true
          base_sha=""

          case "$EVENT_NAME:$EVENT_ACTION" in
            pull_request:synchronize)
              base_sha="$EVENT_BEFORE"
              ;;
            pull_request:*)
              base_sha="$PR_BASE_SHA"
              ;;
            push:*)
              base_sha="$EVENT_BEFORE"
              ;;
          esac

          if [[ -z "$base_sha" || "$base_sha" =~ ^0+$ ]] \
            || ! git cat-file -e "${base_sha}^{commit}" \
            || ! git cat-file -e "${HEAD_SHA}^{commit}"; then
            resolved=false
          fi

          if [[ "$FULL_CANDIDATE" == "true" ]]; then
            documentation=true
            rust=true
            python=true
            desktop=true
            scripts=true
            package=true
          elif "$resolved"; then
            while IFS= read -r -d '' path; do
              case "$path" in
                .github/workflows/release.yml)
                  documentation=true; rust=true; python=true; desktop=true; scripts=true; package=true
                  ;;
                docs/*|*.md)
                  documentation=true
                  ;;
                LICENSE-APACHE|LICENSE-MIT|deny.toml|Cargo.toml|Cargo.lock|\
                rust-toolchain.toml|rustfmt.toml|vendor/*)
                  rust=true; package=true
                  ;;
                crates/market-squawk-python/*)
                  rust=true; python=true
                  ;;
                crates/*|adapters/*|apps/market-squawk/*|apps/market-squawk-installer/*|fuzz/*)
                  rust=true
                  ;;
                apps/market-squawk-desktop/src-tauri/*)
                  rust=true; desktop=true; package=true
                  ;;
                apps/market-squawk-desktop/*)
                  desktop=true; package=true
                  ;;
                python/*)
                  python=true; scripts=true; package=true
                  ;;
                scripts/verify.sh)
                  rust=true; python=true; desktop=true; scripts=true
                  ;;
                scripts/build_complete_release.py|scripts/build_python_release.py)
                  python=true; scripts=true; package=true
                  ;;
                distribution/*|dist-workspace.toml)
                  scripts=true; package=true
                  ;;
                scripts/*|.github/*)
                  scripts=true
                  ;;
                *)
                  documentation=true; rust=true; python=true; desktop=true; scripts=true; package=true
                  ;;
              esac
            done < <(git diff --name-only -z "$base_sha" "$HEAD_SHA")
          else
            # An unresolved comparison is never treated as a narrow change.
            documentation=true; rust=true; python=true; desktop=true; scripts=true; package=true
          fi

          include=()
          "$scripts" && include+=('{"name":"script contracts","lane":"scripts","rust":true,"frontend":false,"system_dependencies":false,"timeout":20}')
          "$desktop" && include+=('{"name":"frontend","lane":"frontend","rust":false,"frontend":true,"system_dependencies":false,"timeout":20}')
          if "$rust"; then
            include+=('{"name":"Clippy","lane":"clippy","rust":true,"frontend":false,"system_dependencies":true,"timeout":60}')
            include+=('{"name":"workspace tests","lane":"tests","rust":true,"frontend":false,"system_dependencies":true,"timeout":60}')
            include+=('{"name":"UI and Trybuild","lane":"ui","rust":true,"frontend":false,"system_dependencies":false,"timeout":45}')
            include+=('{"name":"exact Loom inventories","lane":"loom","rust":true,"frontend":false,"system_dependencies":false,"timeout":60}')
          fi
          [[ "$FULL_CANDIDATE" == "true" ]] \
            && include+=('{"name":"release and Rustdoc","lane":"release","rust":true,"frontend":false,"system_dependencies":true,"timeout":60}')
          joined=""
          printf -v joined ',%s' "${include[@]}"
          code=false
          ((${#include[@]} > 0)) && code=true
          {
            echo "code=$code"
            echo "documentation=$documentation"
            echo "rust=$rust"
            echo "python=$python"
            echo "desktop=$desktop"
            echo "scripts=$scripts"
            echo "package=$package"
            printf 'linux_matrix={"include":[%s]}\n' "${joined:1}"
          } >> "$GITHUB_OUTPUT"

  policy:
    name: Policy and security
    needs: classify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # actions/checkout v7.0.1, verified release commit (2026-07-22).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check documentation whitespace
        if: needs.classify.outputs.documentation == 'true'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ env.CANDIDATE_SHA }}
        run: |
          set -euo pipefail

          if [[ -n "$BASE_SHA" && ! "$BASE_SHA" =~ ^0+$ ]] \
            && git cat-file -e "${BASE_SHA}^{commit}"; then
            git diff --check "$BASE_SHA" "$HEAD_SHA"
          else
            git show --check --format= "$HEAD_SHA"
          fi
      # dtolnay/rust-toolchain generic action, verified commit (2026-07-15).
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        if: needs.classify.outputs.rust == 'true'
        with:
          toolchain: 1.97.1
      # taiki-e/install-action v2.85.3, verified release commit (2026-07-24).
      - uses: taiki-e/install-action@18b1216eba7f8039b0f8d131d5473787f0edce68
        if: needs.classify.outputs.rust == 'true'
        with:
          tool: cargo-audit@0.22.2,cargo-deny@0.20.2
      - name: Install pinned Gitleaks CLI
        shell: bash
        run: |
          archive="$RUNNER_TEMP/gitleaks_8.30.1_linux_x64.tar.gz"
          binary_dir="$RUNNER_TEMP/gitleaks-bin"
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output "$archive" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" \
            | sha256sum --check --strict
          mkdir -p "$binary_dir"
          tar -xzf "$archive" -C "$binary_dir" gitleaks
          echo "$binary_dir" >> "$GITHUB_PATH"
      - name: Check repository inputs and secrets
        run: |
          python3 scripts/check_generated_artifacts.py
          gitleaks dir --redact --no-banner .
          gitleaks git --redact --no-banner
      - name: Check Rust workspace and dependency policy
        if: needs.classify.outputs.rust == 'true'
        run: |
          python3 scripts/check_workspace_boundaries.py
          cargo fetch --locked --quiet
          fetched=false
          for attempt in 1 2 3; do
            if cargo deny fetch db; then
              fetched=true
              break
            fi
            advisory_root="${CARGO_HOME:?}/advisory-dbs"
            if [[ -d "$advisory_root" ]]; then
              while IFS= read -r database; do
                if ! git -C "$database" rev-parse --verify HEAD >/dev/null 2>&1; then
                  rm -rf -- "$database"
                fi
              done < <(
                find "$advisory_root" \
                  -mindepth 1 -maxdepth 1 -type d -name 'advisory-db-*' -print
              )
            fi
            if (( attempt < 3 )); then
              sleep "$((attempt * 5))"
            fi
          done
          [[ "$fetched" == "true" ]]
          mapfile -t advisory_dbs < <(
            find "$CARGO_HOME/advisory-dbs" \
              -mindepth 1 -maxdepth 1 -type d -name 'advisory-db-*' -print
          )
          (( ${#advisory_dbs[@]} == 1 ))
          advisory_db="${advisory_dbs[0]}"
          advisory_commit="$(git -C "$advisory_db" rev-parse --verify HEAD)"
          [[ "$advisory_commit" =~ ^[0-9a-f]{40}$ ]]
          echo "RustSec advisory database commit: $advisory_commit"

          cargo deny --offline check
          cargo audit --db "$advisory_db" --no-fetch --deny warnings \
            --ignore RUSTSEC-2024-0370 \
            --ignore RUSTSEC-2024-0411 \
            --ignore RUSTSEC-2024-0412 \
            --ignore RUSTSEC-2024-0413 \
            --ignore RUSTSEC-2024-0415 \
            --ignore RUSTSEC-2024-0416 \
            --ignore RUSTSEC-2024-0418 \
            --ignore RUSTSEC-2024-0419 \
            --ignore RUSTSEC-2024-0420 \
            --ignore RUSTSEC-2024-0436 \
            --ignore RUSTSEC-2025-0075 \
            --ignore RUSTSEC-2025-0080 \
            --ignore RUSTSEC-2025-0081 \
            --ignore RUSTSEC-2025-0098 \
            --ignore RUSTSEC-2025-0100

  documentation-links:
    name: Documentation links
    needs: classify
    if: needs.classify.outputs.documentation == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # actions/checkout v7.0.1, verified release commit (2026-07-22).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      # lycheeverse/lychee-action v2.9.0, verified release commit (2026-07-09).
      - name: Check all local Markdown links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8
        with:
          lycheeVersion: v0.24.2
          args: >-
            --offline --no-progress
            --root-dir "$GITHUB_WORKSPACE"
            'README.md' 'docs/**/*.md'
      # actions/cache v6.1.0, verified release commit (2026-06-26).
      - name: Restore Lychee response cache
        id: lychee-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .lycheecache
          key: lychee-v1-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            lychee-v1-${{ runner.os }}-
      # lycheeverse/lychee-action v2.9.0, verified release commit (2026-07-09).
      - name: Check maintained external Markdown links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8
        with:
          lycheeVersion: v0.24.2
          args: >-
            --verbose --no-progress
            --root-dir "$GITHUB_WORKSPACE"
            --cache --max-cache-age 1d
            --cache-exclude-status '429,500..=599'
            --max-concurrency 4
            --max-retries 0
            'README.md' 'SECURITY.md' 'CONTRIBUTING.md'
            'docs/README.md' 'docs/project-memory.md' 'docs/verification.md'
            'docs/architecture/**/*.md' 'docs/operations/**/*.md'
            'docs/reference/**/*.md' 'docs/testing/**/*.md'
      - name: Save Lychee response cache
        if: >-
          ${{
            always() &&
            github.event_name == 'push' &&
            github.ref == 'refs/heads/main'
          }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .lycheecache
          key: ${{ steps.lychee-cache.outputs.cache-primary-key }}

  python:
    name: Python source contracts
    needs: classify
    if: needs.classify.outputs.python == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # actions/checkout v7.0.1, verified release commit (2026-07-22).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false
      # actions/setup-python v7.0.0, verified release commit (2026-07-13).
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: 3.14.6
      - name: Compile every Python product and test module
        env:
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}/python-ci-pycache
        run: python3 -m compileall -q python/market_squawk python/tests

  linux:
    name: Linux ${{ matrix.name }}
    needs: classify
    if: needs.classify.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.classify.outputs.linux_matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.timeout }}
    steps:
      # actions/checkout v7.0.1, verified release commit (2026-07-22).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install Tauri system prerequisites
        if: matrix.system_dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends \
            build-essential \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev
      # pnpm/action-setup v6.0.9, verified release commit (2026-07-18).
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
        if: matrix.frontend
        with:
          package_json_file: apps/market-squawk-desktop/package.json
      # actions/setup-node v7.0.0, verified release commit (2026-07-21).
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        if: matrix.frontend
        with:
          node-version: 24.18.0
          cache: pnpm
          cache-dependency-path: apps/market-squawk-desktop/pnpm-lock.yaml
      # dtolnay/rust-toolchain generic action, verified commit (2026-07-15).
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        if: matrix.rust
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - name: Report the pinned Rust toolchain
        if: matrix.rust
        run: |
          rustc --version
          cargo --version
      - name: Run ${{ matrix.name }}
        run: ./scripts/verify.sh --lane "${{ matrix.lane }}"
      # actions/upload-artifact v7.0.1, verified release commit (2026-04-10).
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: matrix.lane == 'release'
        with:
          name: cargo-timings-${{ env.CANDIDATE_SHA }}
          path: target/cargo-timings/cargo-timing.html
          if-no-files-found: error
          retention-days: 14

  macos:
    name: macOS workspace
    needs: classify
    if: needs.classify.outputs.rust == 'true'
    runs-on: macos-15-intel
    timeout-minutes: 60
    steps:
      # actions/checkout v7.0.1, verified release commit (2026-07-22).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false
      # dtolnay/rust-toolchain generic action, verified commit (2026-07-15).
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.97.1
      # Swatinem/rust-cache v2.9.1, verified release commit (2026-03-12).
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
        with:
          workspaces: ". -> target"
          shared-key: ci-${{ runner.os }}-rust-1.97.1-${{ hashFiles('Cargo.lock') }}-dev
          cache-targets: "true"
          cache-on-failure: "false"
          cache-all-crates: "false"
          cache-workspace-crates: "false"
          save-if: >-
            ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
                (github.event_name == 'pull_request' &&
                 github.event.pull_request.head.repo.full_name == github.repository) }}
      - run: rustc --version
      - run: cargo --version
      - name: Run the locked workspace tests within the Cargo target ceiling
        shell: bash
        run: |
          check_target() {
            local usage_kib=0
            [[ ! -d target ]] || usage_kib="$(du -sk target | awk '{print $1}')"
            df -h .
            (( usage_kib <= 20 * 1024 * 1024 ))
          }
          check_target
          cargo test --workspace --all-features --locked --no-fail-fast
          check_target

  windows:
    name: Windows workspace
    needs: classify
    if: needs.classify.outputs.rust == 'true'
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      # actions/checkout v7.0.1, verified release commit (2026-07-22).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false
      # dtolnay/rust-toolchain generic action, verified commit (2026-07-15).
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.97.1
      # Swatinem/rust-cache v2.9.1, verified release commit (2026-03-12).
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
        with:
          workspaces: ". -> target"
          shared-key: ci-${{ runner.os }}-rust-1.97.1-${{ hashFiles('Cargo.lock') }}-dev
          cache-targets: "true"
          cache-on-failure: "false"
          cache-all-crates: "false"
          cache-workspace-crates: "false"
          save-if: >-
            ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
                (github.event_name == 'pull_request' &&
                 github.event.pull_request.head.repo.full_name == github.repository) }}
      - run: rustc --version
      - run: cargo --version
      # The optional capture-benchmark evidence runner requires Linux/macOS process-group
      # containment. Windows validates the complete shipping/default workspace instead.
      - name: Run the locked workspace tests within the Cargo target ceiling
        shell: bash
        run: |
          check_target() {
            local usage_kib=0
            [[ ! -d target ]] || usage_kib="$(du -sk target | awk '{print $1}')"
            df -h .
            (( usage_kib <= 20 * 1024 * 1024 ))
          }
          check_target
          cargo test --workspace --locked --no-fail-fast
          check_target

  desktop-packages:
    name: Desktop package (${{ matrix.name }})
    needs: classify
    if: >-
      needs.classify.outputs.platform == 'true' &&
      needs.classify.outputs.package == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            executable_suffix: ""
            uv_relative: uv-x86_64-unknown-linux-gnu/uv
            bundles: deb,appimage
            reclaim_before_dmg: false
            timeout: 180
          - name: macOS Apple Silicon
            os: macos-15
            target: aarch64-apple-darwin
            executable_suffix: ""
            uv_relative: uv-aarch64-apple-darwin/uv
            bundles: app,dmg
            reclaim_before_dmg: false
            timeout: 210
          - name: macOS Intel
            os: macos-15-intel
            target: x86_64-apple-darwin
            executable_suffix: ""
            uv_relative: uv-x86_64-apple-darwin/uv
            bundles: app
            reclaim_before_dmg: true
            timeout: 240
          - name: Windows x64
            os: windows-2025
            target: x86_64-pc-windows-msvc
            executable_suffix: .exe
            uv_relative: uv.exe
            bundles: nsis,msi
            reclaim_before_dmg: false
            timeout: 240
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout }}
    steps:
      # actions/checkout v7.0.1, verified release commit (2026-07-22).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false
      - name: Install Tauri system prerequisites
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends \
            build-essential \
            dbus-x11 \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            xvfb
      # pnpm/action-setup v6.0.9, verified release commit (2026-07-18).

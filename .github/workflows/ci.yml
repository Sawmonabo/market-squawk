            "$native/market-squawk-desktop$EXE"
          cp "target/$TARGET/release/market-squawk-capture-helper$EXE" \
            "$native/market-squawk-capture-helper$EXE"
          cp "target/$TARGET/release/market-squawk-service$EXE" \
            "$native/market-squawk-service$EXE"
          cp "target/$TARGET/release/market-squawk-mcp-relay$EXE" \
            "$native/market-squawk-mcp-relay$EXE"
          cp "target/$TARGET/release/market-squawk-installer$EXE" \
            "$native/market-squawk-installer$EXE"
          cp "$MARKET_SQUAWK_COMPONENT_ROOT/expanded/uv/$UV_RELATIVE" \
            "$native/uv$EXE"

          python3 scripts/build_complete_release.py \
            --target "$TARGET" \
            --native-trust-mode provenance-only \
            --version "$version" \
            --commit "$CANDIDATE_SHA" \
            --tree "$(git rev-parse 'HEAD^{tree}')" \
            --python-release "$MARKET_SQUAWK_PYTHON_PRODUCT" \
            --native-bundle "$native" \
            --output "$RUNNER_TEMP/complete-release"

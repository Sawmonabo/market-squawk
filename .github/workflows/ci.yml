        run: |
          set -euo pipefail

          built_binary="target/$TARGET/release/market-squawk-desktop"
          saved_binary="$RUNNER_TEMP/market-squawk-desktop"
          install -m 755 "$built_binary" "$saved_binary"
          df -h .
          cargo clean --release --target "$TARGET"
          mkdir -p "$(dirname "$built_binary")"
          install -m 755 "$saved_binary" "$built_binary"
          df -h .

          pnpm --dir apps/market-squawk-desktop tauri bundle \
            --config src-tauri/tauri.bundle.conf.json \
            --target "$TARGET" \
            --ci \
            --no-sign \
            --bundles app,dmg \
            --verbose
      - name: Verify the terminal ZIP installation route
        shell: bash
        env:
          EXE: ${{ matrix.executable_suffix }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail

          bootstrap="$MARKET_SQUAWK_RELEASE_OUTPUT/market-squawk-bootstrap-$TARGET$EXE"
          bundle="$MARKET_SQUAWK_RELEASE_OUTPUT/market-squawk-$MARKET_SQUAWK_RELEASE_VERSION-$TARGET.zip"
          manifest="$MARKET_SQUAWK_RELEASE_OUTPUT/market-squawk-release.json"
          # Windows runner temp has runner-managed ACLs; exercise the per-user install boundary.
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            install_root="$(cygpath -u "$LOCALAPPDATA")/MarketSquawk/ci-verification/program"
          else
            install_root="$RUNNER_TEMP/installed-product"
          fi
          unset \
            MARKET_SQUAWK_COMPONENT_ROOT \
            MARKET_SQUAWK_PYTHON_PRODUCT \
            MARKET_SQUAWK_RELEASE_OUTPUT \
            MARKET_SQUAWK_RELEASE_VERSION \
            MARKET_SQUAWK_TRAINING_FOUNDATION_RECEIPT
          "$bootstrap" --root "$install_root" install \
            --manifest "$manifest" \
            --bundle "$bundle"
          "$bootstrap" --root "$install_root" status --json
          "$bootstrap" --root "$install_root" uninstall
          [[ ! -e "$install_root" ]]
      - name: Install and verify the local DMG
        if: runner.os == 'macOS'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail

          [[ "$(git rev-parse HEAD)" == "$CANDIDATE_SHA" ]]
          dmg="$(find "target/$TARGET/release/bundle/dmg" \
            -maxdepth 1 -type f -name '*.dmg' -print)"
          [[ -n "$dmg" && "$dmg" != *$'\n'* ]]
          package_sha="$(shasum -a 256 "$dmg" | awk '{print $1}')"
          [[ "$package_sha" =~ ^[0-9a-f]{64}$ ]]
          hdiutil verify "$dmg"

          mount="$RUNNER_TEMP/market-squawk-dmg"
          application="$RUNNER_TEMP/Applications/Market Squawk.app"
          release_version="$MARKET_SQUAWK_RELEASE_VERSION"
          home="$HOME"
          state_search_root="$HOME/Library/Application Support"
          requested_data="$RUNNER_TEMP/native-data"
          log="$RUNNER_TEMP/native-desktop.log"
          desktop_pid=""
          install -d -m 700 \
            "$mount" \
            "$RUNNER_TEMP/Applications" \
            "$requested_data"
          mkdir -p "$state_search_root"
          cleanup() {
            if [[ -n "$desktop_pid" ]] && kill -0 "$desktop_pid" 2>/dev/null; then
              kill "$desktop_pid" 2>/dev/null || true
              wait "$desktop_pid" 2>/dev/null || true
            fi
            if mount | rg -F -q "on $mount "; then
              hdiutil detach "$mount"
            fi
          }
          trap cleanup EXIT
          hdiutil attach "$dmg" -readonly -nobrowse -mountpoint "$mount"
          packaged="$mount/Market Squawk.app"
          [[ -d "$packaged" && ! -L "$packaged" ]]
          ditto "$packaged" "$application"
          hdiutil detach "$mount"

          unset \
            MARKET_SQUAWK_COMPONENT_ROOT \
            MARKET_SQUAWK_PYTHON_PRODUCT \
            MARKET_SQUAWK_RELEASE_OUTPUT \
            MARKET_SQUAWK_RELEASE_VERSION \
            MARKET_SQUAWK_TRAINING_FOUNDATION_RECEIPT
          HOME="$home" "$application/Contents/MacOS/market-squawk-desktop" \
            --data-dir "$requested_data" >"$log" 2>&1 &
          desktop_pid=$!
          state=""
          for _attempt in {1..120}
          do
            state="$(find "$state_search_root" -type f \
              -path '*/program/installation.json' \
              -print -quit)"
            if [[ -n "$state" ]]; then
              break
            fi
            if ! kill -0 "$desktop_pid" 2>/dev/null; then
              cat "$log"
              exit 1
            fi
            sleep 1
          done
          [[ -n "$state" ]]
          sleep 3
          kill -0 "$desktop_pid"
          kill "$desktop_pid"
          wait "$desktop_pid" || true
          desktop_pid=""

          root="$(dirname "$state")"
          data_root="$(dirname "$root")"
          installer="$(find "$root/versions" -type f \
            -path '*/bin/market-squawk-installer' -print)"
          application_cli="$(find "$root/versions" -type f \
            -path '*/bin/market-squawk' -print)"
          relay="$(find "$root/versions" -type f \
            -path '*/bin/market-squawk-mcp-relay' -print)"
          runtime="$(find "$root/versions" -type f -path '*/bin/python' -print)"
          [[ -n "$installer" && "$installer" != *$'\n'* ]]
          [[ -n "$application_cli" && "$application_cli" != *$'\n'* ]]
          [[ -n "$relay" && "$relay" != *$'\n'* ]]
          [[ -n "$runtime" && "$runtime" != *$'\n'* ]]

          sentinel="$data_root/portfolios/native-package-smoke.txt"
          sentinel_content='native-package-user-data-v1'
          install -d -m 700 "$(dirname "$sentinel")"
          printf '%s' "$sentinel_content" > "$sentinel"
          HOME="$home" "$installer" --root "$root" status --json
          HOME="$home" "$installer" --root "$root" repair
          HOME="$home" "$installer" --root "$root" service status --json
          HOME="$home" "$application_cli" --data-dir "$data_root" \
            --output json doctor
          HOME="$home" "$application_cli" --data-dir "$data_root" \
            --output json setup status
          HOME="$home" "$runtime" -I -B -c \
            'import market_squawk, pyarrow; print(pyarrow.__version__)'
          HOME="$home" python3 scripts/smoke_mcp.py "$relay" \
            --installed-relay --running-service --data-dir "$data_root" \
            --client claude-code
          HOME="$home" python3 scripts/smoke_mcp.py "$relay" \
            --installed-relay --running-service --data-dir "$data_root" \
            --client codex

          update_request="$RUNNER_TEMP/signed-update-request.json"
          update_evidence="$RUNNER_TEMP/signed-update-evidence"
          jq -n \
            --arg install_root "$root" \
            --arg manifest "$RUNNER_TEMP/complete-release/market-squawk-release.json" \
            --arg bundle "$RUNNER_TEMP/complete-release/market-squawk-$release_version-$TARGET.zip" \
            --arg evidence_directory "$update_evidence" \
            '{
              installRoot: $install_root,
              manifest: $manifest,
              bundle: $bundle,
              evidenceDirectory: $evidence_directory
            }' > "$update_request"
          MARKET_SQUAWK_UPDATE_FIXTURE_REQUEST="$update_request" \
            cargo test -p market-squawk-installer \
              tests::signed_update_fixture_activates_and_rolls_back_an_installed_package \
              --locked -- --ignored --exact
          [[ -f "$update_evidence/receipt.json" ]]
          HOME="$home" "$installer" --root "$root" status --json
          HOME="$home" "$installer" --root "$root" service status --json
          HOME="$home" "$application_cli" --data-dir "$data_root" \
            --output json doctor

          HOME="$home" "$application/Contents/MacOS/market-squawk-desktop" \
            --native-uninstall
          [[ ! -e "$root" ]]
          [[ -f "$sentinel" ]]
          [[ "$(cat "$sentinel")" == "$sentinel_content" ]]
          /bin/rm -rf -- "$application"
          [[ ! -e "$application" ]]
          [[ "$(shasum -a 256 "$dmg" | awk '{print $1}')" == "$package_sha" ]]
          printf 'verified DMG sha256=%s\n' "$package_sha"
      - name: Install and verify the local NSIS package
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
        run: |
          $ErrorActionPreference = "Stop"

          if ((git rev-parse HEAD).Trim() -ne $env:CANDIDATE_SHA) {
            throw "The native package smoke is not running at the frozen candidate."
          }
          $packages = @(
            Get-ChildItem `
              -Path "target/$env:TARGET/release/bundle/nsis" `
              -Filter "*.exe" `
              -File
          )
          if ($packages.Count -ne 1) {
            throw "The Windows build did not produce exactly one NSIS package."
          }
          $package = $packages[0]
          $packageSha = (Get-FileHash -Algorithm SHA256 $package.FullName).Hash.ToLowerInvariant()
          if ($packageSha -notmatch '^[0-9a-f]{64}$') {
            throw "The NSIS package digest is invalid."
          }
          if ((Get-AuthenticodeSignature $package.FullName).Status -ne "NotSigned") {
            throw "The provenance-only NSIS package has unexpected publisher state."
          }
          $install = Start-Process `
            -FilePath $package.FullName `
            -ArgumentList "/S" `
            -Wait `
            -PassThru
          if ($install.ExitCode -ne 0) {
            throw "The local NSIS package installation failed."
          }

          $desktopNames = @("market-squawk-desktop.exe", "Market Squawk.exe")
          $desktops = @(
            Get-ChildItem `
              -Path $env:LOCALAPPDATA, $env:ProgramFiles `
              -File `
              -Recurse `
              -ErrorAction SilentlyContinue |
              Where-Object { $_.Name -in $desktopNames }
          )
          $desktops = @($desktops | Sort-Object FullName -Unique)
          if ($desktops.Count -ne 1) {
            throw "The NSIS package did not install exactly one desktop executable."
          }
          $desktop = $desktops[0]
          $releaseVersion = $env:MARKET_SQUAWK_RELEASE_VERSION
          @(
            "MARKET_SQUAWK_COMPONENT_ROOT",
            "MARKET_SQUAWK_PYTHON_PRODUCT",
            "MARKET_SQUAWK_RELEASE_OUTPUT",
            "MARKET_SQUAWK_RELEASE_VERSION",
            "MARKET_SQUAWK_TRAINING_FOUNDATION_RECEIPT"
          ) | ForEach-Object { Remove-Item "Env:$_" -ErrorAction SilentlyContinue }

          $requestedData = Join-Path $env:RUNNER_TEMP "native-data"
          $stdout = Join-Path $env:RUNNER_TEMP "native-desktop.stdout.log"
          $stderr = Join-Path $env:RUNNER_TEMP "native-desktop.stderr.log"
          $packageProcess = Start-Process `
            -FilePath $desktop.FullName `
            -ArgumentList @("--data-dir", $requestedData) `
            -RedirectStandardOutput $stdout `
            -RedirectStandardError $stderr `
            -PassThru
          $managedProcess = $null
          try {
            $state = @()
            foreach ($attempt in 1..120) {
              $state = @(
                Get-ChildItem `
                  -Path $env:LOCALAPPDATA `
                  -Filter installation.json `
                  -File `
                  -Recurse `
                  -ErrorAction SilentlyContinue |
                  Where-Object { $_.DirectoryName -like "*Market*Squawk*program" }
              )
              if ($state.Count -gt 1) {
                throw "The NSIS package created ambiguous managed program state."
              }
              if ($state.Count -eq 1) {
                $managedDesktops = @(
                  Get-ChildItem `
                    -Path (Join-Path $state[0].DirectoryName "versions") `
                    -Filter market-squawk-desktop.exe `
                    -File `
                    -Recurse
                )
                if ($managedDesktops.Count -gt 1) {
                  throw "The managed Windows release contains ambiguous desktops."
                }
                if ($managedDesktops.Count -eq 1) {
                  $managedProcesses = @(
                    Get-Process `
                      -Name market-squawk-desktop `
                      -ErrorAction SilentlyContinue |
                      Where-Object { $_.Path -eq $managedDesktops[0].FullName }
                  )
                  if ($managedProcesses.Count -gt 1) {
                    throw "Multiple managed Windows desktops are running."
                  }
                  if ($managedProcesses.Count -eq 1) {
                    $managedProcess = $managedProcesses[0]
                    break
                  }
                }
              }
              if ($packageProcess.HasExited -and $packageProcess.ExitCode -ne 0) {
                Get-Content $stdout, $stderr -ErrorAction SilentlyContinue
                throw "The NSIS desktop exited before activation completed."
              }
              Start-Sleep -Seconds 1
            }
            if ($state.Count -ne 1 -or $null -eq $managedProcess) {
              Get-Content $stdout, $stderr -ErrorAction SilentlyContinue
              throw "The NSIS desktop did not activate and launch its managed release."
            }
            Start-Sleep -Seconds 3
            $managedProcess.Refresh()
            if ($managedProcess.HasExited) {
              throw "The managed Windows desktop did not remain operational."
            }
          } finally {
            if ($null -ne $managedProcess) {
              $managedProcess.Refresh()
              if (-not $managedProcess.HasExited) {
                Stop-Process -Id $managedProcess.Id -Force
                $managedProcess.WaitForExit()
              }
            }
            if (-not $packageProcess.HasExited) {
              Stop-Process -Id $packageProcess.Id -Force
              $packageProcess.WaitForExit()
            }
          }

          $root = $state[0].DirectoryName
          $dataRoot = Split-Path $root -Parent
          $installer = @(
            Get-ChildItem `
              -Path (Join-Path $root "versions") `
              -Filter market-squawk-installer.exe `
              -File `
              -Recurse
          )
          $application = @(
            Get-ChildItem `
              -Path (Join-Path $root "versions") `
              -Filter market-squawk.exe `
              -File `
              -Recurse
          )
          $relay = @(
            Get-ChildItem `
              -Path (Join-Path $root "versions") `
              -Filter market-squawk-mcp-relay.exe `
              -File `
              -Recurse
          )
          $runtime = @(
            Get-ChildItem `
              -Path (Join-Path $root "versions") `
              -Filter python.exe `
              -File `
              -Recurse
          )
          if (
            $installer.Count -ne 1 -or
            $application.Count -ne 1 -or
            $relay.Count -ne 1 -or
            $runtime.Count -ne 1
          ) {
            throw "The installed Windows product component set is incomplete."
          }

          $sentinel = Join-Path $dataRoot "portfolios/native-package-smoke.txt"
          $sentinelContent = "native-package-user-data-v1"
          New-Item -ItemType Directory -Force (Split-Path $sentinel -Parent) | Out-Null
          [IO.File]::WriteAllText($sentinel, $sentinelContent)
          & $installer[0].FullName --root $root status --json
          if ($LASTEXITCODE -ne 0) { throw "Installed-product status failed." }
          & $installer[0].FullName --root $root repair
          if ($LASTEXITCODE -ne 0) { throw "Installed-product repair failed." }
          & $installer[0].FullName --root $root service status --json
          if ($LASTEXITCODE -ne 0) { throw "Installed-service health failed." }
          & $application[0].FullName --data-dir $dataRoot --output json doctor
          if ($LASTEXITCODE -ne 0) { throw "Installed CLI doctor failed." }
          & $application[0].FullName --data-dir $dataRoot --output json setup status
          if ($LASTEXITCODE -ne 0) { throw "Installed setup status failed." }
          & $runtime[0].FullName -I -B -c `
            "import market_squawk, pyarrow; print(pyarrow.__version__)"
          if ($LASTEXITCODE -ne 0) { throw "Managed Python admission failed." }
          python scripts/smoke_mcp.py $relay[0].FullName `
            --installed-relay --running-service --data-dir $dataRoot `
            --client claude-code
          if ($LASTEXITCODE -ne 0) { throw "Claude Code MCP smoke failed." }
          python scripts/smoke_mcp.py $relay[0].FullName `
            --installed-relay --running-service --data-dir $dataRoot `
            --client codex
          if ($LASTEXITCODE -ne 0) { throw "Codex MCP smoke failed." }

          $updateEvidence = Join-Path $env:RUNNER_TEMP "signed-update-evidence"
          $updateRequest = Join-Path $env:RUNNER_TEMP "signed-update-request.json"
          $fixtureRequest = [ordered]@{
            installRoot = $root
            manifest = Join-Path $env:RUNNER_TEMP `
              "complete-release/market-squawk-release.json"
            bundle = Join-Path $env:RUNNER_TEMP `
              "complete-release/market-squawk-$releaseVersion-$env:TARGET.zip"
            evidenceDirectory = $updateEvidence
          }
          $fixtureRequest |
            ConvertTo-Json -Depth 3 |
            Set-Content -LiteralPath $updateRequest -Encoding utf8
          $env:MARKET_SQUAWK_UPDATE_FIXTURE_REQUEST = $updateRequest
          try {
            cargo test -p market-squawk-installer `
              tests::signed_update_fixture_activates_and_rolls_back_an_installed_package `
              --locked -- --ignored --exact
            if ($LASTEXITCODE -ne 0) {
              throw "The installed signed update and rollback scenario failed."
            }
          } finally {
            Remove-Item Env:MARKET_SQUAWK_UPDATE_FIXTURE_REQUEST `
              -ErrorAction SilentlyContinue
          }
          if (-not (Test-Path (Join-Path $updateEvidence "receipt.json") -PathType Leaf)) {
            throw "The signed update scenario did not publish its evidence receipt."
          }
          & $installer[0].FullName --root $root status --json
          if ($LASTEXITCODE -ne 0) { throw "Post-rollback product status failed." }
          & $installer[0].FullName --root $root service status --json
          if ($LASTEXITCODE -ne 0) { throw "Post-rollback service health failed." }
          & $application[0].FullName --data-dir $dataRoot --output json doctor
          if ($LASTEXITCODE -ne 0) { throw "Post-rollback CLI doctor failed." }

          $uninstallers = @(
            Get-ChildItem `
              -Path $desktop.DirectoryName `
              -Filter "*uninstall*.exe" `
              -File `
              -Recurse `
              -ErrorAction SilentlyContinue
          )
          if ($uninstallers.Count -ne 1) {
            throw "The NSIS package uninstaller is unavailable."
          }
          $remove = Start-Process `
            -FilePath $uninstallers[0].FullName `
            -ArgumentList "/S" `
            -Wait `
            -PassThru
          if ($remove.ExitCode -ne 0) {
            throw "The NSIS package uninstall failed."
          }
          if (Test-Path $root) {
            throw "The NSIS uninstall left managed program state behind."
          }
          if (
            -not (Test-Path $sentinel -PathType Leaf) -or
            [IO.File]::ReadAllText($sentinel) -ne $sentinelContent
          ) {
            throw "The NSIS uninstall did not preserve user data."
          }
          $observedPackageSha = (Get-FileHash -Algorithm SHA256 $package.FullName).Hash.ToLowerInvariant()
          if ($observedPackageSha -ne $packageSha) {
            throw "The tested NSIS package changed before collection."
          }
          Write-Output "verified NSIS sha256=$packageSha"
      - name: Install and verify the local AppImage
        if: runner.os == 'Linux'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail

          [[ "$(git rev-parse HEAD)" == "$CANDIDATE_SHA" ]]
          mapfile -d '' appimages \
            < <(find "target/$TARGET/release/bundle/appimage" -maxdepth 1 \
              -type f -name '*.AppImage' -print0)
          [[ "${#appimages[@]}" -eq 1 ]]
          package_sha="$(sha256sum "${appimages[0]}" | awk '{print $1}')"
          [[ "$package_sha" =~ ^[0-9a-f]{64}$ ]]
          desktop="$RUNNER_TEMP/Market-Squawk.AppImage"
          release_version="$MARKET_SQUAWK_RELEASE_VERSION"
          cp "${appimages[0]}" "$desktop"
          chmod u+x "$desktop"

          unset \
            MARKET_SQUAWK_COMPONENT_ROOT \
            MARKET_SQUAWK_PYTHON_PRODUCT \
            MARKET_SQUAWK_RELEASE_OUTPUT \
            MARKET_SQUAWK_RELEASE_VERSION \
            MARKET_SQUAWK_TRAINING_FOUNDATION_RECEIPT
          home="$HOME"
          requested_data="$RUNNER_TEMP/native-data"
          xdg="${XDG_DATA_HOME:-$HOME/.local/share}"
          log="$RUNNER_TEMP/native-desktop.log"
          desktop_pid=""
          cleanup() {
            if [[ -n "$desktop_pid" ]] && kill -0 "$desktop_pid" 2>/dev/null; then
              pkill -TERM -P "$desktop_pid" 2>/dev/null || true
              kill "$desktop_pid" 2>/dev/null || true
              wait "$desktop_pid" 2>/dev/null || true
            fi
          }
          trap cleanup EXIT
          install -d -m 700 "$requested_data"
          mkdir -p "$xdg"
          APPIMAGE_EXTRACT_AND_RUN=1 \
            HOME="$home" \
            XDG_DATA_HOME="$xdg" \
            xvfb-run -a "$desktop" --data-dir "$requested_data" >"$log" 2>&1 &
          desktop_pid=$!
          state=""
          for _attempt in {1..120}
          do
            state="$(find "$xdg" "$home" -type f \
              -path '*/program/installation.json' -print -quit)"
            if [[ -n "$state" ]]; then
              break
            fi
            if ! kill -0 "$desktop_pid" 2>/dev/null; then
              cat "$log"
              exit 1
            fi
            sleep 1
          done
          [[ -n "$state" ]]
          sleep 3
          kill -0 "$desktop_pid"
          pkill -TERM -P "$desktop_pid" 2>/dev/null || true
          kill "$desktop_pid" 2>/dev/null || true
          wait "$desktop_pid" || true
          desktop_pid=""

          root="$(dirname "$state")"
          data_root="$(dirname "$root")"
          installer="$(find "$root/versions" -type f \
            -path '*/bin/market-squawk-installer' -print)"
          application="$(find "$root/versions" -type f \
            -path '*/bin/market-squawk' -print)"
          relay="$(find "$root/versions" -type f \
            -path '*/bin/market-squawk-mcp-relay' -print)"
          runtime="$(find "$root/versions" -type f -path '*/bin/python' -print)"
          [[ -n "$installer" && "$installer" != *$'\n'* ]]
          [[ -n "$application" && "$application" != *$'\n'* ]]
          [[ -n "$relay" && "$relay" != *$'\n'* ]]
          [[ -n "$runtime" && "$runtime" != *$'\n'* ]]

          sentinel="$data_root/portfolios/native-package-smoke.txt"
          sentinel_content='native-package-user-data-v1'
          install -d -m 700 "$(dirname "$sentinel")"
          printf '%s' "$sentinel_content" > "$sentinel"
          HOME="$home" XDG_DATA_HOME="$xdg" \
            "$installer" --root "$root" status --json
          HOME="$home" XDG_DATA_HOME="$xdg" \
            "$installer" --root "$root" repair
          HOME="$home" XDG_DATA_HOME="$xdg" \
            "$installer" --root "$root" service status --json
          HOME="$home" XDG_DATA_HOME="$xdg" \
            "$application" --data-dir "$data_root" --output json doctor
          HOME="$home" XDG_DATA_HOME="$xdg" \
            "$application" --data-dir "$data_root" --output json setup status
          HOME="$home" XDG_DATA_HOME="$xdg" \
            "$runtime" -I -B -c \
            'import market_squawk, pyarrow; print(pyarrow.__version__)'
          HOME="$home" XDG_DATA_HOME="$xdg" \
            python3 scripts/smoke_mcp.py "$relay" \
            --installed-relay --running-service --data-dir "$data_root" \
            --client claude-code
          HOME="$home" XDG_DATA_HOME="$xdg" \
            python3 scripts/smoke_mcp.py "$relay" \
            --installed-relay --running-service --data-dir "$data_root" \
            --client codex

          update_request="$RUNNER_TEMP/signed-update-request.json"
          update_evidence="$RUNNER_TEMP/signed-update-evidence"
          jq -n \
            --arg install_root "$root" \
            --arg manifest "$RUNNER_TEMP/complete-release/market-squawk-release.json" \
            --arg bundle "$RUNNER_TEMP/complete-release/market-squawk-$release_version-$TARGET.zip" \
            --arg evidence_directory "$update_evidence" \
            '{
              installRoot: $install_root,
              manifest: $manifest,
              bundle: $bundle,
              evidenceDirectory: $evidence_directory
            }' > "$update_request"
          MARKET_SQUAWK_UPDATE_FIXTURE_REQUEST="$update_request" \
            cargo test -p market-squawk-installer \
              tests::signed_update_fixture_activates_and_rolls_back_an_installed_package \
              --locked -- --ignored --exact
          [[ -f "$update_evidence/receipt.json" ]]
          HOME="$home" XDG_DATA_HOME="$xdg" \
            "$installer" --root "$root" status --json
          HOME="$home" XDG_DATA_HOME="$xdg" \
            "$installer" --root "$root" service status --json
          HOME="$home" XDG_DATA_HOME="$xdg" \
            "$application" --data-dir "$data_root" --output json doctor

          help="$(APPIMAGE_EXTRACT_AND_RUN=1 "$desktop" --help)"
          if rg -F -- '--stdio-mcp' <<<"$help"; then
            echo "hidden AppImage MCP transport appeared in ordinary help" >&2
            exit 1
          fi
          stdout="$RUNNER_TEMP/appimage-mcp-outside.stdout"
          stderr="$RUNNER_TEMP/appimage-mcp-outside.stderr"
          if "target/$TARGET/release/market-squawk-desktop" \
            --stdio-mcp \
            --data-dir "$RUNNER_TEMP/appimage-mcp-outside-data" \
            >"$stdout" 2>"$stderr"; then
            echo "hidden MCP transport ran outside a verified AppImage" >&2
            exit 1
          fi
          [[ ! -s "$stdout" ]]
          rg -F 'installed MCP transport is unavailable' "$stderr"
          APPIMAGE_EXTRACT_AND_RUN=1 \
            HOME="$home" \
            XDG_DATA_HOME="$xdg" \
            python3 scripts/smoke_mcp.py "$desktop" --desktop-appimage \
            --data-dir "$data_root"

          APPIMAGE_EXTRACT_AND_RUN=1 \
            HOME="$home" \
            XDG_DATA_HOME="$xdg" \
            "$desktop" --native-uninstall
          [[ ! -e "$root" ]]
          [[ -f "$sentinel" ]]
          [[ "$(cat "$sentinel")" == "$sentinel_content" ]]
          rm -- "$desktop"
          [[ ! -e "$desktop" ]]
          [[ "$(sha256sum "${appimages[0]}" | awk '{print $1}')" == "$package_sha" ]]
          printf 'verified AppImage sha256=%s\n' "$package_sha"
      - name: Collect the closed platform artifact set
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail

          python3 scripts/build_complete_release.py collect \
            --target "$TARGET" \
            --version "$MARKET_SQUAWK_RELEASE_VERSION" \
            --release-output "$MARKET_SQUAWK_RELEASE_OUTPUT" \
            --native-bundle "target/$TARGET/release/bundle" \
            --native-package-trust-mode provenance-only \
            --output "$RUNNER_TEMP/platform-publish"
      # actions/upload-artifact v7.0.1, verified release commit (2026-04-10).
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: market-squawk-${{ matrix.target }}-${{ env.CANDIDATE_SHA }}
          path: ${{ runner.temp }}/platform-publish/*
          if-no-files-found: error
          retention-days: 7
      # Keep test evidence separate from the builder's exact platform asset set.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: installed-update-${{ matrix.target }}-${{ env.CANDIDATE_SHA }}
          path: ${{ runner.temp }}/signed-update-evidence/receipt.json
          if-no-files-found: error
          retention-days: 7
      - name: Enforce the post-build Cargo target ceiling
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          usage_kib=0
          [[ ! -d target ]] || usage_kib="$(du -sk target | awk '{print $1}')"
          df -h .
          (( usage_kib <= 20 * 1024 * 1024 ))

  owner-test-aggregate:
    name: Assemble the unpublished four-target candidate
    needs:
      - classify
      - desktop-packages
    if: >-
      needs.classify.outputs.platform == 'true' &&
      needs.desktop-packages.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # actions/checkout v7.0.1, verified release commit (2026-07-22).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      # actions/download-artifact v8.0.1, verified release commit (2026-07-23).
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: market-squawk-*-${{ env.CANDIDATE_SHA }}
          path: ${{ runner.temp }}/platform
      - name: Aggregate and verify the exact candidate without publication
        shell: bash
        env:
          TREE_SHA: ${{ needs.classify.outputs.tree_sha }}
        run: |
          set -euo pipefail

          [[ "$(git rev-parse HEAD)" == "$CANDIDATE_SHA" ]]
          [[ "$(git rev-parse 'HEAD^{tree}')" == "$TREE_SHA" ]]
          git diff --quiet
          git diff --cached --quiet
          mapfile -d '' inputs \
            < <(find "$RUNNER_TEMP/platform" -mindepth 1 -maxdepth 1 \
              -type d -name "market-squawk-*-$CANDIDATE_SHA" -print0 | sort -z)
          [[ "${#inputs[@]}" -eq 4 ]]
          arguments=()
          for input in "${inputs[@]}"
          do
            arguments+=(--input "$input")
          done
          python3 scripts/build_complete_release.py aggregate \
            "${arguments[@]}" \
            --install-template distribution/install.sh \
            --output "$RUNNER_TEMP/owner-test-candidate"
          (
            cd "$RUNNER_TEMP/owner-test-candidate"
            sha256sum --check --strict SHA256SUMS
          )
          jq -e \
            --arg commit "$CANDIDATE_SHA" \
            --arg tree "$TREE_SHA" \
            '.commit_sha == $commit
             and .tree_sha == $tree
             and .schema_version == 2
             and (.targets | length) == 4
             and ([.targets[].target] | unique | length) == 4' \
            "$RUNNER_TEMP/owner-test-candidate/market-squawk-release.json"
          sh -n "$RUNNER_TEMP/owner-test-candidate/install.sh"
          if rg -n '__MARKET_SQUAWK_[A-Z0-9_]+__' \
            "$RUNNER_TEMP/owner-test-candidate/install.sh"; then
            echo "The rendered installer retains release-builder tokens." >&2
            exit 1
          fi
      # actions/upload-artifact v7.0.1, verified release commit (2026-04-10).
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: market-squawk-owner-test-${{ env.CANDIDATE_SHA }}
          path: ${{ runner.temp }}/owner-test-candidate/*
          if-no-files-found: error
          retention-days: 7

  gate:
    name: CI Gate
    if: always()
    needs:
      - classify
      - policy
      - documentation-links
      - python
      - linux
      - macos
      - windows
      - desktop-packages
      - owner-test-aggregate
    runs-on: ubuntu-24.04
    steps:
      - name: Require every scheduled lane
        shell: bash
        env:
          CODE: ${{ needs.classify.outputs.code }}
          DOCUMENTATION: ${{ needs.classify.outputs.documentation }}
          RUST: ${{ needs.classify.outputs.rust }}
          PYTHON: ${{ needs.classify.outputs.python }}
          PLATFORM: ${{ needs.classify.outputs.platform }}
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          POLICY_RESULT: ${{ needs.policy.result }}
          DOCUMENTATION_LINKS_RESULT: ${{ needs.documentation-links.result }}
          PYTHON_RESULT: ${{ needs.python.result }}
          LINUX_RESULT: ${{ needs.linux.result }}
          MACOS_RESULT: ${{ needs.macos.result }}
          WINDOWS_RESULT: ${{ needs.windows.result }}
          DESKTOP_RESULT: ${{ needs.desktop-packages.result }}
          AGGREGATE_RESULT: ${{ needs.owner-test-aggregate.result }}
        run: |
          set -euo pipefail

          [[ "$CLASSIFY_RESULT" == "success" ]]
          [[ "$POLICY_RESULT" == "success" ]]

          if [[ "$DOCUMENTATION" == "true" ]]; then
            [[ "$DOCUMENTATION_LINKS_RESULT" == "success" ]]
          else
            [[ "$DOCUMENTATION_LINKS_RESULT" == "skipped" ]]
          fi

          if [[ "$PYTHON" == "true" ]]; then
            [[ "$PYTHON_RESULT" == "success" ]]
          else
            [[ "$PYTHON_RESULT" == "skipped" ]]
          fi

          if [[ "$CODE" == "true" ]]; then
            [[ "$LINUX_RESULT" == "success" ]]
          else
            [[ "$LINUX_RESULT" == "skipped" ]]
          fi

          if [[ "$RUST" == "true" ]]; then
            [[ "$MACOS_RESULT" == "success" ]]
            [[ "$WINDOWS_RESULT" == "success" ]]
          else
            [[ "$MACOS_RESULT" == "skipped" ]]
            [[ "$WINDOWS_RESULT" == "skipped" ]]
          fi

          if [[ "$PLATFORM" == "true" ]]; then
            [[ "$DESKTOP_RESULT" == "success" ]]
            [[ "$AGGREGATE_RESULT" == "success" ]]
          else
            [[ "$DESKTOP_RESULT" == "skipped" ]]
            [[ "$AGGREGATE_RESULT" == "skipped" ]]
          fi

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"

jobs:
  classify:
    name: Classify changes
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.changes.outputs.code }}
      desktop: ${{ steps.changes.outputs.desktop }}
    steps:
      # actions/checkout v6.0.2, verified release commit (2026-01-09).
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: changes
        name: Classify the exact change set
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail

          code=false
          desktop=false
          resolved=true

          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]] \
            || ! git cat-file -e "${BASE_SHA}^{commit}" \
            || ! git cat-file -e "${HEAD_SHA}^{commit}"; then
            resolved=false
          fi

          if "$resolved"; then
            while IFS= read -r -d '' path; do
              case "$path" in
                docs/*|*.md)
                  ;;
                *)
                  code=true
                  ;;
              esac

              case "$path" in
                apps/market-squawk-desktop/*|\
                apps/market-squawk/assets/provider-onboarding/*|\
                apps/market-squawk/src/local_product/*|\
                Cargo.toml|Cargo.lock|rust-toolchain.toml|rustfmt.toml|\
                scripts/verify.sh|.github/workflows/ci.yml)
                  desktop=true
                  ;;
              esac
            done < <(git diff --name-only -z "$BASE_SHA" "$HEAD_SHA")
          else
            # An unresolved comparison is never treated as documentation-only.
            code=true
            desktop=true
          fi

          {
            echo "code=$code"
            echo "desktop=$desktop"
          } >> "$GITHUB_OUTPUT"

  policy:
    name: Policy and security
    needs: classify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # actions/checkout v6.0.2, verified release commit (2026-01-09).
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: false
      # dtolnay/rust-toolchain generic action, verified commit (2026-06-30).
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: 1.97.1
      # taiki-e/install-action v2.83.4, verified release commit (2026-07-17).
      - uses: taiki-e/install-action@07b4745e0c39a41822af610387492e3e53aa222b
        with:
          tool: cargo-audit@0.22.2,cargo-deny@0.20.2
      - name: Install pinned Gitleaks CLI
        shell: bash
        run: |
          archive="$RUNNER_TEMP/gitleaks_8.30.1_linux_x64.tar.gz"
          binary_dir="$RUNNER_TEMP/gitleaks-bin"
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output "$archive" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" \
            | sha256sum --check --strict
          mkdir -p "$binary_dir"
          tar -xzf "$archive" -C "$binary_dir" gitleaks
          echo "$binary_dir" >> "$GITHUB_PATH"
      - run: ./scripts/verify.sh --policy-only

  verify:
    name: Linux release verification
    needs: classify
    if: needs.classify.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      # actions/checkout v6.0.2, verified release commit (2026-01-09).
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Tauri system prerequisites
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends \
            build-essential \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev
      # pnpm/action-setup v6.0.8, verified release commit (2026-05-12).
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093
        with:
          package_json_file: apps/market-squawk-desktop/package.json
      # actions/setup-node v6.4.0, verified release commit (2026-04-20).
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.18.0
          cache: pnpm
          cache-dependency-path: apps/market-squawk-desktop/pnpm-lock.yaml
      # dtolnay/rust-toolchain generic action, verified commit (2026-06-30).
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      # Swatinem/rust-cache v2.9.1, verified release commit (2026-03-12).
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
        with:
          workspaces: ". -> target"
          cache-targets: "true"
          cache-on-failure: "false"
          cache-all-crates: "false"
          cache-workspace-crates: "false"
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      # taiki-e/install-action v2.83.4, verified release commit (2026-07-17).
      - uses: taiki-e/install-action@07b4745e0c39a41822af610387492e3e53aa222b
        with:
          tool: cargo-audit@0.22.2,cargo-deny@0.20.2
      - name: Install pinned Gitleaks CLI
        shell: bash
        run: |
          archive="$RUNNER_TEMP/gitleaks_8.30.1_linux_x64.tar.gz"
          binary_dir="$RUNNER_TEMP/gitleaks-bin"
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output "$archive" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" \
            | sha256sum --check --strict
          mkdir -p "$binary_dir"
          tar -xzf "$archive" -C "$binary_dir" gitleaks
          echo "$binary_dir" >> "$GITHUB_PATH"
      - run: rustc --version
      - run: cargo --version
      - run: ./scripts/verify.sh

  macos:
    name: macOS workspace
    needs: classify
    if: needs.classify.outputs.code == 'true'
    runs-on: macos-15-intel
    timeout-minutes: 60
    steps:
      # actions/checkout v6.0.2, verified release commit (2026-01-09).
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      # dtolnay/rust-toolchain generic action, verified commit (2026-06-30).
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: 1.97.1
      # Swatinem/rust-cache v2.9.1, verified release commit (2026-03-12).
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
        with:
          workspaces: ". -> target"
          cache-targets: "true"
          cache-on-failure: "false"
          cache-all-crates: "false"
          cache-workspace-crates: "false"
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - run: rustc --version
      - run: cargo --version
      - run: cargo test --workspace --all-features --locked

  windows:
    name: Windows workspace
    needs: classify
    if: needs.classify.outputs.code == 'true'
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      # actions/checkout v6.0.2, verified release commit (2026-01-09).
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      # dtolnay/rust-toolchain generic action, verified commit (2026-06-30).
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: 1.97.1
      # Swatinem/rust-cache v2.9.1, verified release commit (2026-03-12).
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
        with:
          workspaces: ". -> target"
          cache-targets: "true"
          cache-on-failure: "false"
          cache-all-crates: "false"
          cache-workspace-crates: "false"
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - run: rustc --version
      - run: cargo --version
      # The optional capture-benchmark evidence runner requires Linux/macOS process-group
      # containment. Windows validates the complete shipping/default workspace instead.
      - run: cargo test --workspace --locked

  desktop-packages:
    name: Desktop package (${{ matrix.name }})
    needs: classify
    if: needs.classify.outputs.desktop == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-24.04
            bundles: deb,appimage
          - name: macOS Apple Silicon
            os: macos-15
            bundles: app,dmg
          - name: macOS Intel
            os: macos-15-intel
            bundles: app,dmg
          - name: Windows x64
            os: windows-2025
            bundles: nsis,msi
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      # actions/checkout v6.0.2, verified release commit (2026-01-09).
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Install Tauri system prerequisites
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends \
            build-essential \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev
      # pnpm/action-setup v6.0.8, verified release commit (2026-05-12).
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093
        with:
          package_json_file: apps/market-squawk-desktop/package.json
      # actions/setup-node v6.4.0, verified release commit (2026-04-20).
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.18.0
          cache: pnpm
          cache-dependency-path: apps/market-squawk-desktop/pnpm-lock.yaml
      # dtolnay/rust-toolchain generic action, verified commit (2026-06-30).
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: 1.97.1
      # Swatinem/rust-cache v2.9.1, verified release commit (2026-03-12).
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
        with:
          workspaces: ". -> target"
          cache-targets: "true"
          cache-on-failure: "false"
          cache-all-crates: "false"
          cache-workspace-crates: "false"
          save-if: >-
            ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
                (github.event_name == 'pull_request' &&
                 github.event.pull_request.head.repo.full_name == github.repository) }}
      - run: pnpm --dir apps/market-squawk-desktop install --frozen-lockfile
      - run: pnpm --dir apps/market-squawk-desktop typecheck
      - run: pnpm --dir apps/market-squawk-desktop test --run
      # tauri-apps/tauri-action v0.6.2, official release commit (2026-03-14).
      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5
        with:
          projectPath: apps/market-squawk-desktop
          args: --ci --no-sign --bundles ${{ matrix.bundles }}
      # actions/upload-artifact v7.0.1, verified release commit (2026-04-10).
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: market-squawk-${{ matrix.name }}-${{ github.sha }}
          path: target/release/bundle/**
          if-no-files-found: error
          retention-days: 7

  gate:
    name: CI Gate
    if: always()
    needs:
      - classify
      - policy
      - verify
      - macos
      - windows
      - desktop-packages
    runs-on: ubuntu-24.04
    steps:
      - name: Require every scheduled lane
        shell: bash
        env:
          CODE: ${{ needs.classify.outputs.code }}
          DESKTOP: ${{ needs.classify.outputs.desktop }}
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          POLICY_RESULT: ${{ needs.policy.result }}
          VERIFY_RESULT: ${{ needs.verify.result }}
          MACOS_RESULT: ${{ needs.macos.result }}
          WINDOWS_RESULT: ${{ needs.windows.result }}
          DESKTOP_RESULT: ${{ needs.desktop-packages.result }}
        run: |
          set -euo pipefail

          [[ "$CLASSIFY_RESULT" == "success" ]]
          [[ "$POLICY_RESULT" == "success" ]]

          if [[ "$CODE" == "true" ]]; then
            [[ "$VERIFY_RESULT" == "success" ]]
            [[ "$MACOS_RESULT" == "success" ]]
            [[ "$WINDOWS_RESULT" == "success" ]]
          else
            [[ "$VERIFY_RESULT" == "skipped" ]]
            [[ "$MACOS_RESULT" == "skipped" ]]
            [[ "$WINDOWS_RESULT" == "skipped" ]]
          fi

          if [[ "$DESKTOP" == "true" ]]; then
            [[ "$DESKTOP_RESULT" == "success" ]]
          else
            [[ "$DESKTOP_RESULT" == "skipped" ]]
          fi

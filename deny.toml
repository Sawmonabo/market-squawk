# Market Squawk dependency policy. Keep this fail-closed and review every exception in source.

[graph]
targets = [
    "aarch64-apple-darwin",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
]
all-features = true

[advisories]
unmaintained = "all"
unsound = "all"
yanked = "deny"
maximum-db-staleness = "P7D"
unused-ignored-advisory = "deny"
# Parquet 58.3.0 unconditionally depends on unmaintained paste 1.0.15. Current Tauri 2's supported
# Linux WebKitGTK backend unconditionally resolves the archived gtk-rs 0.18 bindings, the old macro
# helper, and urlpattern's unmaintained rust-unic 0.9 parser graph. Tauri 2 has no stable GTK4
# backend. RUSTSEC-2024-0429 is separately corrected by the exact reviewed local glib backport in
# vendor/glib-0.18.5 and therefore is not ignored here. These are informational maintenance
# findings, not undisclosed vulnerability findings. Refresh this exact list on every Tauri upgrade
# and remove entries as soon as the stable upstream graph permits it.
ignore = [
    "RUSTSEC-2024-0370",
    "RUSTSEC-2024-0411",
    "RUSTSEC-2024-0412",
    "RUSTSEC-2024-0413",
    "RUSTSEC-2024-0415",
    "RUSTSEC-2024-0416",
    "RUSTSEC-2024-0418",
    "RUSTSEC-2024-0419",
    "RUSTSEC-2024-0420",
    "RUSTSEC-2024-0436",
    "RUSTSEC-2025-0075",
    "RUSTSEC-2025-0080",
    "RUSTSEC-2025-0081",
    "RUSTSEC-2025-0098",
    "RUSTSEC-2025-0100",
]

[licenses]
confidence-threshold = 0.93
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
]
exceptions = [
    { allow = ["MITNFA"], crate = "hex_lit@0.1.1" },
    { allow = ["CDLA-Permissive-2.0"], crate = "webpki-roots@0.26.11" },
    { allow = ["CDLA-Permissive-2.0"], crate = "webpki-roots@1.0.8" },
    # Required tract-onnx 0.23.4 transitively compiles dyn-eq into the local ONNX backend.
    # Keep the weak-copyleft admission exact; distribution obligations and source are recorded in
    # docs/licenses/tract-onnx-notice.md.
    { allow = ["MPL-2.0"], crate = "dyn-eq@0.1.3" },
    # Current Tauri 2 HTML parsing and native-directory discovery graph. Versions, package
    # checksums, source links, and distribution obligations are recorded in
    # docs/licenses/tauri-mpl-notice.md.
    { allow = ["MPL-2.0"], crate = "cssparser@0.36.0" },
    { allow = ["MPL-2.0"], crate = "cssparser-macros@0.6.1" },
    { allow = ["MPL-2.0"], crate = "dtoa-short@0.3.5" },
    { allow = ["MPL-2.0"], crate = "option-ext@0.2.0" },
    { allow = ["MPL-2.0"], crate = "selectors@0.36.1" },
    # Exact transitive DataFusion 54 dependency versions; keep Zlib scoped to these crates.
    { allow = ["Zlib"], crate = "foldhash@0.1.5" },
    { allow = ["Zlib"], crate = "foldhash@0.2.0" },
    { allow = ["Zlib"], crate = "zlib-rs@0.6.6" },
]

[licenses.private]
ignore = false
registries = []

[bans]
# Duplicate versions are not security defects by themselves. Security, license, source, TLS,
# telemetry, and wildcard policy remain fail-closed below.
multiple-versions = "allow"
wildcards = "deny"
highlight = "all"
allow = []
allow-workspace = true
deny = [
    { crate = "native-tls", reason = "Market Squawk standardizes on rustls-backed TLS" },
    { crate = "native-tls-sys", reason = "Native TLS bindings are outside the reviewed TLS stack" },
    { crate = "openssl", reason = "Market Squawk standardizes on rustls-backed TLS" },
    { crate = "openssl-sys", reason = "Native OpenSSL bindings are outside the reviewed TLS stack" },
    { crate = "opentelemetry", reason = "Version 1 forbids mandatory OpenTelemetry infrastructure" },
    { crate = "opentelemetry-otlp", reason = "Version 1 forbids mandatory OpenTelemetry infrastructure" },
    { crate = "opentelemetry_sdk", reason = "Version 1 forbids mandatory OpenTelemetry infrastructure" },
    { crate = "tracing-opentelemetry", reason = "Version 1 forbids mandatory OpenTelemetry infrastructure" },
]
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[sources.allow-org]
github = []
gitlab = []
bitbucket = []

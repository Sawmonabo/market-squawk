[workspace]
resolver = "3"
members = ["apps/*", "crates/*", "adapters/*"]
default-members = ["apps/market-squawk"]

[workspace.package]
edition = "2024"
rust-version = "1.97.1"
version = "0.1.0"
license = "Apache-2.0 OR MIT"

[workspace.dependencies]
anyhow = "1.0"
arc-swap = "=1.9.2"
argon2 = { version = "=0.5.3", default-features = false, features = [
    "alloc",
    "zeroize",
] }
arrow = { version = "=58.3.0", default-features = false, features = [
    "canonical_extension_types",
    "ipc",
] }
async-trait = "0.1"
atomicwrites = "=0.4.4"
bs58 = "0.5"
bytes = "1.10"
cap-fs-ext = "4.0.2"
cap-std = "4.0.2"
bitcoin = { version = "=0.32.102", default-features = false, features = ["std"] }
blake3 = "=1.8.5"
chacha20poly1305 = { version = "=0.11.0", default-features = false, features = [
    "alloc",
    "getrandom",
    "zeroize",
] }
chrono = { version = "0.4", features = ["clock", "serde"] }
chrono-tz = "=0.10.4"
clap = { version = "4.5", features = ["derive", "env"] }
criterion = "=0.8.2"
crc32fast = "1.4"
csv = "=1.4.0"
encoding_rs = "=0.8.35"
datafusion = { version = "=54.0.0", default-features = false, features = [
    "parquet",
    "recursive_protection",
    "sql",
] }
fs2 = "0.4"
futures-util = "0.3"
getrandom = "=0.3.4"
httpdate = { version = "=1.0.3", default-features = false }
keyring = { version = "=4.1.5", default-features = false, features = ["v1"] }
libc = "0.2"
market-squawk-adapter-coinbase = { path = "adapters/market-squawk-adapter-coinbase", version = "=0.1.0" }
market-squawk-adapter-kraken = { path = "adapters/market-squawk-adapter-kraken", version = "=0.1.0" }
market-squawk-adapter-paper = { path = "adapters/market-squawk-adapter-paper", version = "=0.1.0" }
market-squawk-analytics = { path = "crates/market-squawk-analytics", version = "=0.1.0" }
market-squawk-data = { path = "crates/market-squawk-data", version = "=0.1.0" }
market-squawk-domain = { path = "crates/market-squawk-domain", version = "=0.1.0" }
market-squawk-execution = { path = "crates/market-squawk-execution", version = "=0.1.0" }
market-squawk-live = { path = "crates/market-squawk-live", version = "=0.1.0" }
market-squawk-mcp = { path = "crates/market-squawk-mcp", version = "=0.1.0" }
market-squawk-modeling = { path = "crates/market-squawk-modeling", version = "=0.1.0" }
market-squawk-platform = { path = "crates/market-squawk-platform", version = "=0.1.0" }
market-squawk-services = { path = "crates/market-squawk-services", version = "=0.1.0" }
market-squawk-sources = { path = "crates/market-squawk-sources", version = "=0.1.0" }
memory-stats = "=1.2.0"
num-bigint = "0.4"
parking_lot = "0.12"
parquet = { version = "=58.3.0", default-features = false, features = [
    "arrow",
    "async",
    "crc",
    "zstd",
] }
quick-xml = { version = "=0.41.0", default-features = false, features = ["encoding"] }
reqwest = { version = "=0.13.4", default-features = false, features = [
    "gzip",
    "json",
    "rustls-no-provider",
    "stream",
] }
loom = "=0.7.2"
proptest = "1.7"
rust_decimal = { version = "1.36", features = ["serde-with-str"] }
rand_chacha = "=0.9.0"
rand_core = "=0.9.5"
rustls = { version = "=0.23.42", default-features = false, features = ["ring", "std"] }
rustix = { version = "=1.1.4", features = ["fs", "process"] }
rmcp = { version = "=2.2.0", default-features = false, features = [
    "server",
    "transport-io",
] }
rusqlite = { version = "=0.40.1", default-features = false, features = [
    "backup",
    "bundled",
    "hooks",
    "limits",
    "serialize",
] }
schemars = { version = "=1.2.1", default-features = false, features = [
    "derive",
    "std",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["arbitrary_precision"] }
sha2 = "0.10"
sha3 = "0.10"
static_assertions = "1.1"
tempfile = "3.15"
thiserror = "2.0"
trybuild = "1.0"
tokio = { version = "1.43", features = [
    "io-std",
    "io-util",
    "macros",
    "net",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }
tokio-util = "0.7"
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
toml = "1.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
uuid = { version = "1.12", features = ["serde", "v4", "v5"] }
url = "2.5"
zeroize = "1.8"
zip = { version = "=8.6.0", default-features = false, features = [
    "deflate-flate2-zlib-rs",
] }

[workspace.lints.rust]
unsafe_code = "forbid"
unreachable_pub = "warn"
unused_must_use = "deny"
missing_debug_implementations = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(loom)"] }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
cargo = { level = "warn", priority = -1 }
# Transitive platform and protocol stacks can legitimately resolve independent major versions.
# Cargo Deny remains authoritative for security, license, source, and crate bans.
multiple_crate_versions = "allow"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"

[profile.dev]
debug = "line-tables-only"
incremental = true

[profile.dev.package."*"]
debug = false

[profile.dev.package.argon2]
debug = false
opt-level = 3

[profile.test]
debug = "line-tables-only"
incremental = true

[profile.test.package."*"]
debug = false

[profile.test.package.argon2]
debug = false
opt-level = 3

[profile.debugging]
inherits = "dev"
debug = "full"
incremental = false

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"

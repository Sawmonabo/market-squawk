[workspace]
resolver = "3"
# Task 11 adds `adapters/*` atomically with the first working adapter crate.
members = ["apps/*", "crates/*"]
default-members = ["apps/market-squawk"]

[workspace.package]
edition = "2024"
rust-version = "1.97"
version = "0.1.0"
license = "Apache-2.0 OR MIT"

[workspace.dependencies]
anyhow = "1.0"
async-trait = "0.1"
bs58 = "0.5"
bitcoin = { version = "=0.32.102", default-features = false, features = ["std"] }
chrono = { version = "0.4", features = ["clock", "serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
crc32fast = "1.4"
fs2 = "0.4"
futures-util = "0.3"
num-bigint = "0.4"
parking_lot = "0.12"
proptest = "1.7"
rust_decimal = { version = "1.36", features = ["serde-with-str"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha3 = "0.10"
static_assertions = "1.1"
tempfile = "3.15"
tokio = { version = "1.43", features = [
    "io-std",
    "io-util",
    "macros",
    "net",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
uuid = { version = "1.12", features = ["serde", "v4", "v5"] }

[workspace.lints.rust]
unsafe_code = "forbid"
unreachable_pub = "warn"
unused_must_use = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
cargo = { level = "warn", priority = -1 }
# Transitive platform and protocol stacks intentionally resolve independent major versions. The
# exact reviewed family/version inventory is enforced by scripts/check_duplicate_dependencies.py.
multiple_crate_versions = "allow"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"

edition.workspace = true
rust-version.workspace = true
version.workspace = true
license.workspace = true
repository = "https://github.com/Sawmonabo/market-squawk"
publish = false

[lib]
name = "_native"
crate-type = ["cdylib", "rlib"]

[dependencies]
market-squawk-analytics = { workspace = true }
market-squawk-data = { workspace = true }

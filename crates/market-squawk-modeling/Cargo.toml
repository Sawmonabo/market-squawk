[package]
name = "market-squawk-modeling"
description = "Closed model bundles, immutable generations, and bounded native or ONNX inference"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository = "https://github.com/Sawmonabo/market-squawk"
publish = false
autotests = false

[features]
default = []
onnx-tract = ["dep:tract-onnx"]
onnx-runtime = ["onnx-tract", "dep:ort"]

[dependencies]
cap-std.workspace = true
market-squawk-analytics.workspace = true
market-squawk-data.workspace = true
market-squawk-domain.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio-util.workspace = true
tract-onnx = { version = "=0.23.4", default-features = false, optional = true }
ort = { version = "=2.0.0-rc.12", default-features = false, features = [
    "api-24",
    "load-dynamic",
    "std",
], optional = true }

[dev-dependencies]
tempfile.workspace = true
prost = "=0.14.3"

[[test]]
name = "modeling_contracts"
path = "tests/modeling_contracts.rs"

[lints]
workspace = true

[[bin]]
name = "market-squawk-model-validator"
path = "src/bin/market_squawk_model_validator.rs"
